// ── AUDIO ─────────────────────────────────────────────────────────────
let AC=null;
async function unlockAudio(){
  if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  if(AC.state==='suspended')try{await AC.resume()}catch(e){}
}
function osc(type,f0,f1,dur,vol,delay=0){
  if(!AC||AC.state!=='running')return;
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;const t=a.currentTime+delay;
  o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}
// Vegas roulette click — woody percussive tick, velocity-timed
function sndSpin(){
  if(!AC||AC.state!=='running')return;
  const a=AC,t=a.currentTime;
  const len=Math.round(a.sampleRate*0.022);
  const buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(); src.buffer=buf;
  const bp=a.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=850+Math.random()*350; bp.Q.value=7;
  const g=a.createGain();
  g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.022);
  src.connect(bp); bp.connect(g); g.connect(a.destination);
  src.start(t); src.stop(t+0.03);
  // Subtle ring tone
  const ring=a.createOscillator(),rg=a.createGain();
  ring.type='sine'; ring.frequency.value=1200+Math.random()*300;
  rg.gain.setValueAtTime(0.035,t); rg.gain.exponentialRampToValueAtTime(0.001,t+0.07);
  ring.connect(rg); rg.connect(a.destination); ring.start(t); ring.stop(t+0.09);
}
function sndBing(){
  osc('sine',523,523,1.5,0.4); osc('sine',659,659,1.1,0.22,0.04);
  osc('triangle',784,784,0.9,0.14,0.08); osc('sine',1046,1046,0.7,0.08,0.12);
  osc('sine',1318,1318,0.5,0.05,0.18);
}
document.getElementById('sb').addEventListener('click',async function(){
  try{await unlockAudio()}catch(e){}
  document.getElementById('ao').style.display='none';
},{once:true});

// ── FLIGHT TIME ────────────────────────────────────────────────────────
function hvKm(a,b,c,d){
  const R=6371,r=Math.PI/180,dL=(c-a)*r,dG=(d-b)*r;
  const x=Math.sin(dL/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function flightH(la1,lo1,la2,lo2){
  const km=hvKm(la1,lo1,la2,lo2);
  let mid=km/920*1.02+1.5;
  const p1hw=la1>18&&la1<23&&lo1>-162&&lo1<-154;
  const p2hw=la2>18&&la2<23&&lo2>-162&&lo2<-154;
  if(p1hw||p2hw){
    const oLng=p1hw?lo2:lo1,oLat=p1hw?la2:la1;
    if(!(oLng>100)&&!(oLat>7&&oLng>-140&&oLng<-60)&&km>4000)mid+=5;
  }
  const p1nz=la1<-34&&la1>-48&&lo1>166;
  const p2nz=la2<-34&&la2>-48&&lo2>166;
  if((p1nz||p2nz)&&km>3000)mid+=3;
  const total=Math.max(1,Math.round(mid));
  return[Math.max(1,total-1),total+1];
}

// ── GLOBE RENDERING — no CDN needed ──────────────────────────────────
// GEO has 177 countries decoded from Natural Earth 110m, simplified.
// id: ISO numeric country code, r: array of rings [[lng,lat],...]
// Colour helpers
const GREEN_PAL=['#4caf50','#43a047','#388e3c','#2e7d32','#558b2f','#33691e'];
const DESERT_IDS=new Set([12,434,504,706,729,788,818,887,434,434]);
function ctryColor(id){
  if(id==10)return'#e0eeff';           // Antarctica — ice
  if(DESERT_IDS.has(+id))return'#c8a86e'; // North Africa / Arabia — sand
  return GREEN_PAL[Math.abs(+id||0)%GREEN_PAL.length];
}

// Manual orthographic projection (proven, no CDN needed)
const D2R=Math.PI/180;
function proj(lng,lat){
  const λ=(lng-rotation)*D2R,φ=lat*D2R,cosφ=Math.cos(φ);
  return{x:cx+R*cosφ*Math.sin(λ),y:cy-R*Math.sin(φ),v:cosφ*Math.cos(λ)>=-0.01};
}

// Draw polygon rings with visibility clipping
function drawRings(rings){
  for(const ring of rings){
    ctx.beginPath();let pen=false;
    for(const[lng,lat]of ring){
      const p=proj(lng,lat);
      if(!p.v){pen=false;continue;}
      pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);pen=true;
    }
    ctx.closePath();
  }
}

    ctx.beginPath();ctx.arc(p.x,p.y,isL?4.5:2.5,0,Math.PI*2);
    ctx.fillStyle=isL?`rgba(255,230,0,${0.9+pulse*0.1})`:'rgba(255,230,80,0.88)';ctx.fill();
    ctx.strokeStyle=isL?'rgba(255,255,180,1)':'rgba(0,0,0,0.55)';ctx.lineWidth=isL?1.2:0.6;ctx.stroke();
    if(isL){
      const fs=Math.max(11,R*0.065);
      ctx.font=`900 ${fs}px 'Nunito',sans-serif`;ctx.textAlign='center';
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillText(city.name,p.x+1,p.y-8);
      ctx.fillStyle=`rgba(255,235,80,${0.9+pulse*0.1})`;ctx.fillText(city.name,p.x,p.y-9);
    }
  }
  ctx.restore();

  // ── Atmosphere glow (outside clip) ───────────────────────────────
  const atm=ctx.createRadialGradient(cx,cy,R*0.85,cx,cy,R*1.12);
  atm.addColorStop(0,'rgba(100,200,255,0.25)');atm.addColorStop(0.5,'rgba(80,150,255,0.09)');atm.addColorStop(1,'rgba(30,80,255,0)');
  ctx.fillStyle=atm;ctx.beginPath();ctx.arc(cx,cy,R*1.12,0,Math.PI*2);ctx.fill();

  // ── Specular highlight + limb darkening ──────────────────────────
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  const spec=ctx.createRadialGradient(cx-R*0.38,cy-R*0.38,0,cx-R*0.2,cy-R*0.2,R*0.72);
  spec.addColorStop(0,'rgba(255,255,255,0.2)');spec.addColorStop(0.4,'rgba(255,255,255,0.06)');spec.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=spec;ctx.fillRect(cx-R,cy-R,R*2,R*2);
  const limb=ctx.createRadialGradient(cx,cy,R*0.68,cx,cy,R);
  limb.addColorStop(0,'rgba(0,0,0,0)');limb.addColorStop(1,'rgba(0,0,20,0.52)');
  ctx.fillStyle=limb;ctx.fillRect(cx-R,cy-R,R*2,R*2);
  // Rim glow
  ctx.strokeStyle='rgba(120,210,255,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,R-0.5,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function drawNeedle(){
  const gR=R*0.26,gx=cx,gy=cy+R*0.5;
  const bG=ctx.createLinearGradient(gx-gR,gy-gR,gx+gR,gy+gR);
  bG.addColorStop(0,'#ddd');bG.addColorStop(0.3,'#888');bG.addColorStop(0.5,'#ccc');bG.addColorStop(0.8,'#666');bG.addColorStop(1,'#bbb');
  ctx.beginPath();ctx.arc(gx,gy,gR+4,0,Math.PI*2);ctx.fillStyle=bG;ctx.fill();
  const fG=ctx.createRadialGradient(gx-gR*0.2,gy-gR*0.2,0,gx,gy,gR);
  fG.addColorStop(0,'#1c2040');fG.addColorStop(1,'#060b1c');
  ctx.beginPath();ctx.arc(gx,gy,gR,0,Math.PI*2);ctx.fillStyle=fG;ctx.fill();
  for(let i=0;i<=20;i++){
    const a=NEEDLE_MIN+(NEEDLE_MAX-NEEDLE_MIN)*(i/20),big=i%4===0;
    ctx.strokeStyle=big?'rgba(255,255,255,0.85)':'rgba(255,255,255,0.28)';ctx.lineWidth=big?1.5:0.8;
    ctx.beginPath();ctx.moveTo(gx+Math.cos(a)*gR*0.78,gy+Math.sin(a)*gR*0.78);ctx.lineTo(gx+Math.cos(a)*gR*0.93,gy+Math.sin(a)*gR*0.93);ctx.stroke();
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  const lbls=[['STOP',-0.74*Math.PI,'rgba(140,180,255,0.75)'],['FAST',-0.2*Math.PI,'rgba(255,180,50,0.85)'],['ZOOM!',0.22*Math.PI,'rgba(255,80,30,0.95)']];
  for(const[txt,a,col]of lbls){ctx.font=`800 ${Math.max(7,gR*0.18)}px 'Nunito',sans-serif`;ctx.fillStyle=col;ctx.fillText(txt,gx+Math.cos(a)*gR*0.62,gy+Math.sin(a)*gR*0.62);}
  const prog=(needleAngle-NEEDLE_MIN)/(NEEDLE_MAX-NEEDLE_MIN);
  if(prog>0.02){
    const aG=ctx.createLinearGradient(gx-gR,gy,gx+gR,gy);
    aG.addColorStop(0,'rgba(0,180,255,0.6)');aG.addColorStop(0.6,'rgba(255,160,0,0.7)');aG.addColorStop(1,'rgba(255,50,0,0.85)');
    ctx.beginPath();ctx.arc(gx,gy,gR*0.87,NEEDLE_MIN,needleAngle);ctx.strokeStyle=aG;ctx.lineWidth=gR*0.09;ctx.lineCap='round';ctx.stroke();
  }
  ctx.save();ctx.shadowColor='rgba(255,120,0,0.6)';ctx.shadowBlur=8;
  const nG=ctx.createLinearGradient(gx+Math.cos(needleAngle+Math.PI)*gR*0.22,gy+Math.sin(needleAngle+Math.PI)*gR*0.22,gx+Math.cos(needleAngle)*gR*0.78,gy+Math.sin(needleAngle)*gR*0.78);
  nG.addColorStop(0,'#ff3300');nG.addColorStop(0.7,'#ff9900');nG.addColorStop(1,'rgba(255,210,100,0.2)');
  ctx.beginPath();ctx.moveTo(gx+Math.cos(needleAngle+Math.PI)*gR*0.22,gy+Math.sin(needleAngle+Math.PI)*gR*0.22);ctx.lineTo(gx+Math.cos(needleAngle)*gR*0.78,gy+Math.sin(needleAngle)*gR*0.78);ctx.strokeStyle=nG;ctx.lineWidth=Math.max(2.5,gR*0.05);ctx.lineCap='round';ctx.stroke();ctx.restore();
  const pG=ctx.createRadialGradient(gx-gR*0.03,gy-gR*0.03,0,gx,gy,gR*0.1);
  pG.addColorStop(0,'#fff');pG.addColorStop(1,'#888');
  ctx.beginPath();ctx.arc(gx,gy,gR*0.1,0,Math.PI*2);ctx.fillStyle=pG;ctx.fill();
}

function drawParticles(){
  if(!particles.length)return;
  const btn=document.getElementById('spinBtn');const rect=btn.getBoundingClientRect();
  const bx=rect.left+rect.width/2,by=rect.top+rect.height/2;
  for(const p of particles){
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    if(p.shape==='star'){
      ctx.beginPath();for(let i=0;i<10;i++){const r=i%2===0?p.sz:p.sz*0.4,a=Math.PI/5*i-Math.PI/2;i===0?ctx.moveTo(bx+p.x+Math.cos(a)*r,by+p.y+Math.sin(a)*r):ctx.lineTo(bx+p.x+Math.cos(a)*r,by+p.y+Math.sin(a)*r);}ctx.closePath();ctx.fill();
    }else{ctx.beginPath();ctx.arc(bx+p.x,by+p.y,p.sz*0.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}

// ── UPDATE / LOOP ─────────────────────────────────────────────────────
function update(t){
  const dt=Math.min(32,(t-lastT)||16);lastT=t;frameT=t*0.001;
  if(state==='idle'){rotation=(rotation+0.15*(dt/16))%360;landingPulse=0;landedCity=null;}
  if(state==='spinning'){
    rotation=(rotation+spinVel*(dt/16))%360;
    if(spinVel>0.08){
      spinVel*=Math.pow(0.9947,dt/16);
      // Velocity-proportional roulette clicking
      clickTimer-=dt;
      if(clickTimer<=0&&spinVel>0.3){sndSpin();clickTimer=Math.max(18,260/spinVel);}
    }else{
      rotation=((targetLng%360)+360)%360;
      landedCity=targetCity;landingPulse=0;state='result';
      sndBing();setTimeout(()=>showCard(targetCity),450);
    }
    targetNeedle=NEEDLE_MIN+(NEEDLE_MAX-NEEDLE_MIN)*Math.min(1,spinVel/MAX_VEL);
  }
  if(state==='result')landingPulse+=0.07*(dt/16);
  if(state==='idle'||state==='intro')targetNeedle=NEEDLE_MIN;
  needleAngle+=(targetNeedle-needleAngle)*0.11*(dt/16);
  for(const p of particles){p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);p.vy+=0.2;p.life-=0.025*(dt/16);}
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  ctx.clearRect(0,0,GW,GH);
  ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.shadowColor='transparent';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(state==='intro')return;
  try{drawStars(frameT);}catch(e){console.error('drawStars:',e.message);}
  try{drawFloaters();}catch(e){console.error('drawFloaters:',e.message);}
  try{drawGlobe();}catch(e){console.error('drawGlobe:',e.message,e.stack);}
  try{drawNeedle();}catch(e){console.error('drawNeedle:',e.message);}
  try{drawParticles();}catch(e){console.error('drawParticles:',e.message);}
  if(state==='idle'){
    const a=Math.sin(frameT*2)*0.3+0.6;
    ctx.font=`800 ${Math.max(12,R*0.07)}px 'Nunito',sans-serif`;
    ctx.fillStyle=`rgba(255,210,80,${a*0.8})`;ctx.textAlign='center';
    ctx.fillText('👇 Press the button!',cx,cy+R*1.18);
  }
}
function loop(t){update(t);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// ── SPIN ──────────────────────────────────────────────────────────────
function startSpin(){
  if(state!=='idle')return;
  targetCity=CITIES[Math.floor(Math.random()*CITIES.length)];
  targetLng=targetCity.lng;
  const currentNorm=((rotation%360)+360)%360,targetNorm=((targetLng%360)+360)%360;
  let delta=targetNorm-currentNorm;if(delta<0)delta+=360;
  const extra=(4+Math.floor(Math.random()*4))*360;
  spinVel=Math.max(16,Math.min(MAX_VEL,(delta+extra)*0.0053));
  clickTimer=0;state='spinning';
  document.getElementById('spinBtn').disabled=true;
  hideCard();spawnParticles();
}

// ── CARD ──────────────────────────────────────────────────────────────
function showCard(city){
  const[hMin,hMax]=flightH(homeCoords[0],homeCoords[1],city.lat,city.lng);
  const hrs=`${hMin} to ${hMax} hours`;
  const distKm=Math.round(hvKm(homeCoords[0],homeCoords[1],city.lat,city.lng)/100)*100;
  const distMi=Math.round(distKm*0.621/100)*100;
  document.getElementById('cardFlag').textContent=city.flag;
  document.getElementById('cardCity').textContent=city.name;
  document.getElementById('cardCountry').textContent='📍 '+city.country.toUpperCase();
  const factsEl=document.getElementById('cardFacts');factsEl.innerHTML='';
  for(const[icon,text]of city.facts){
    const filled=text.replace('{HOURS}',hrs).replace('{HOME}',homeName||'your home').replace('{MILES}',distMi.toLocaleString()).replace('{KM}',distKm.toLocaleString());
    const div=document.createElement('div');div.className='fact';
    div.innerHTML=`<span class="fact-icon">${icon}</span><span class="fact-text">${filled}</span>`;
    factsEl.appendChild(div);
  }
  document.getElementById('factCard').classList.add('show');
}
function hideCard(){document.getElementById('factCard').classList.remove('show');}
document.getElementById('againBtn').addEventListener('click',()=>{hideCard();landedCity=null;state='idle';document.getElementById('spinBtn').disabled=false;});
document.getElementById('spinBtn').addEventListener('click',startSpin);

// ── INTRO ─────────────────────────────────────────────────────────────
function submitCity(){
  const val=document.getElementById('cityInput').value.trim();if(!val)return;
  homeName=val;homeCoords=getHomeCoords(val);
  document.getElementById('homeLabel').textContent='✈️ FROM '+val.toUpperCase();
  document.getElementById('intro').style.display='none';
  state='idle';document.getElementById('spinBtn').disabled=false;
}
document.getElementById('goBtn').addEventListener('click',submitCity);
document.getElementById('cityInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitCity();});
</script></body></html>
