<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Learn The Body 🧠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c; --gold2:#e8c96a;
  --cream:#fffaf2; --ink:#3a3a3a;
  --boy:#4ea8de; --girl:#ff8fab;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;min-height:100%;background:var(--cream);color:var(--ink);font-family:'Baloo 2',sans-serif;}
body{padding-bottom:160px;overflow-x:hidden;}

/* ── TOP BAR ── */
#topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;
  background:#0d0d0f;border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(201,168,76,0.25);
}
.logo{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(18px,4.5vw,26px);letter-spacing:2px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.home-link{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.06);border:1px solid rgba(201,168,76,0.4);
  color:#e8c96a;text-decoration:none;font-size:17px;
}

/* ── HERO ── */
.hero{text-align:center;padding:18px 16px 10px;}
.hero h1{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,7vw,46px);letter-spacing:3px;
  background:linear-gradient(135deg,#ff8fab,#ffd700,#4ea8de);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 30px rgba(255,215,0,0.15);
}
.hero p{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(13px,3vw,17px);
  color:#7a6a55;margin-top:4px;
}

/* ── MODE TOGGLE - VEGAS ── */
.mode-row{display:flex;justify-content:center;gap:14px;padding:14px 16px;}
.mode-btn{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;letter-spacing:1px;
  padding:13px 28px;border-radius:30px;border:2.5px solid;cursor:pointer;transition:all 0.12s;
  position:relative;
}
.mode-btn:active{transform:translateY(2px);}
.mode-btn.explore{background:#fff;border-color:var(--gold);color:#8a6a1f;box-shadow:0 4px 0 rgba(201,168,76,0.25);}
.mode-btn.explore.active{
  background:linear-gradient(135deg,#ffe066,#ffd700 50%,#c9a84c);color:#1a1a1a;border-color:#fff3b0;
  box-shadow:0 5px 0 #8a6a1f, 0 0 18px rgba(255,215,0,0.5);
}
.mode-btn.quiz{background:#fff;border-color:#9b5de5;color:#6a3aa8;box-shadow:0 4px 0 rgba(155,93,229,0.25);}
.mode-btn.quiz.active{
  background:linear-gradient(135deg,#e0aaff,#c77dff 50%,#9b5de5);color:#fff;border-color:#f3d9ff;
  box-shadow:0 5px 0 #5a2a8a, 0 0 18px rgba(199,125,255,0.5);
}
.mode-btn.explore.active:active,.mode-btn.quiz.active:active{box-shadow:0 2px 0 #8a6a1f;}

/* ── QUIZ BANNER - VEGAS MARQUEE ── */
#quizBanner{
  display:none;max-width:680px;margin:0 auto 10px;padding:18px 24px;border-radius:22px;
  background:linear-gradient(135deg,#7b2ff7,#c77dff 50%,#9b5de5);color:#fff;text-align:center;
  border:3px solid #ffd700;
  box-shadow:0 0 0 4px rgba(255,215,0,0.25), 0 8px 24px rgba(123,47,247,0.35);
  position:relative;
}
#quizBanner.show{display:block;animation:bannerPop 0.4s ease;}
@keyframes bannerPop{0%{transform:scale(0.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
#quizBanner .qtitle{
  font-size:13px;letter-spacing:3px;font-weight:800;
  color:#ffe066;text-shadow:0 0 8px rgba(255,224,102,0.6);
}
#quizBanner .qtext{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,7.5vw,42px);letter-spacing:3px;margin:4px 0;
  text-shadow:0 0 16px rgba(255,255,255,0.4);
}
#quizBanner .qscore{
  display:inline-block;margin-top:4px;padding:5px 16px;border-radius:20px;
  background:rgba(255,215,0,0.2);border:1.5px solid #ffd700;
  font-size:13px;font-weight:800;color:#fff3b0;letter-spacing:1px;
}
#quizFeedback{margin-top:8px;font-weight:800;font-size:16px;min-height:24px;}

/* ── BODIES ── */
.bodies-wrap{
  display:flex;justify-content:center;align-items:flex-start;gap:18px;
  flex-wrap:wrap;padding:6px 16px 10px;
}
.body-col{display:flex;flex-direction:column;align-items:center;width:min(46vw,300px);}
.body-label{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,4vw,22px);letter-spacing:3px;
  padding:6px 24px;border-radius:20px;margin-bottom:8px;color:#fff;
  border:2px solid rgba(255,255,255,0.5);
}
.body-label.boy{background:linear-gradient(135deg,#4ea8de,#2a7fc1);box-shadow:0 0 16px rgba(78,168,222,0.45);}
.body-label.girl{background:linear-gradient(135deg,#ff8fab,#e85d8a);box-shadow:0 0 16px rgba(255,143,171,0.45);}

.body-wrap{position:relative;width:100%;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.12));}
.body-wrap img{display:block;width:100%;height:auto;border-radius:8px;}

.hotspot{
  position:absolute;cursor:pointer;border-radius:50%;
  background:transparent;border:3px solid transparent;
  transition:all 0.18s ease;
}
.hotspot:hover{background:rgba(255,255,255,0.2);border-color:rgba(255,215,0,0.6);}
.hotspot.dim{opacity:0.15;}
.hotspot.highlight{
  background:rgba(255,235,59,0.35);
  border-color:#ffd700;
  box-shadow:0 0 0 4px rgba(255,215,0,0.35), 0 0 22px rgba(255,215,0,0.7);
  animation:hsPulse 1s ease-in-out infinite;
}
.hotspot.correct{
  background:rgba(76,217,100,0.4);border-color:#4cd964;
  box-shadow:0 0 0 6px rgba(76,217,100,0.3), 0 0 26px rgba(76,217,100,0.7);
  animation:correctPulse 0.7s ease;
}
.hotspot.wrong{ animation:wrongShake 0.4s ease; border-color:#ff5b6e; background:rgba(255,91,110,0.25);}
@keyframes hsPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
@keyframes correctPulse{0%{transform:scale(1);}40%{transform:scale(1.22);}100%{transform:scale(1);}}
@keyframes wrongShake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}
}

/* ── INFO CARD - BIGGER, VEGAS ── */
#infoCard{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:linear-gradient(180deg,#ffffff,#fffdf6);
  border-top:5px solid;
  border-image:linear-gradient(90deg,#ffd700,#ff8fab,#4ea8de,#ffd700) 1;
  border-radius:28px 28px 0 0;
  box-shadow:0 -10px 32px rgba(0,0,0,0.18), 0 0 0 3px rgba(255,215,0,0.15) inset;
  padding:22px 24px 28px;
  display:flex;align-items:center;gap:18px;
  transform:translateY(100%);transition:transform 0.32s cubic-bezier(.34,1.56,.64,1);
  max-width:700px;margin:0 auto;
}
#infoCard.show{transform:translateY(0);}
#infoCard .icon-dot{
  width:74px;height:74px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:36px;
  border:4px solid #fff;
  box-shadow:0 0 0 4px var(--gold2), 0 0 22px rgba(255,215,0,0.5), 0 6px 14px rgba(0,0,0,0.15);
}
#infoCard .info-text{flex:1;}
#infoCard .info-label{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,6.5vw,34px);letter-spacing:3px;
  background:linear-gradient(135deg,#1a1a1a,#5a4a2a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
#infoCard .info-desc{font-size:clamp(14px,3.6vw,17px);line-height:1.45;color:#555;margin-top:4px;font-weight:600;}
#closeInfo{
  flex-shrink:0;width:38px;height:38px;border-radius:50%;border:2px solid var(--gold2);
  background:#fffaf0;color:#a8862f;font-size:17px;font-weight:800;cursor:pointer;
}

/* ── CELEBRATION POPUP ── */
#celebrate{
  position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0.5);
  z-index:80;pointer-events:none;opacity:0;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,11vw,72px);letter-spacing:4px;
  text-align:center;white-space:nowrap;
  background:linear-gradient(135deg,#ffd700,#ff8fab,#c77dff,#4ea8de);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 30px rgba(255,215,0,0.6);
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.25));
}
#celebrate.pop{
  animation:celebratePop 1.1s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes celebratePop{
  0%{transform:translate(-50%,-50%) scale(0.3) rotate(-8deg);opacity:0;}
  30%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1;}
  55%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1;}
  85%{opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:0;}
}

/* ── CONFETTI ── */
.confetti{
  position:fixed;top:0;left:0;width:10px;height:10px;z-index:75;pointer-events:none;
  border-radius:2px;
}

@media(min-width:700px){
  .bodies-wrap{gap:50px;}
  .body-col{width:300px;}
}
</style>
</head>

const ORGANS = {"brain": {"label": "BRAIN", "emoji": "\ud83e\udde0", "fill": "#f7b6c2", "desc": "Your brain controls your whole body and helps you think, learn and remember!!"}, "eyes": {"label": "EYES", "emoji": "\ud83d\udc40", "fill": "#ffffff", "desc": "Your eyes let you see the wonderful world around you!!"}, "ears": {"label": "EARS", "emoji": "\ud83d\udc42", "fill": "#f4a18a", "desc": "Your ears help you hear sounds and music, and help you keep your balance!!"}, "nose": {"label": "NOSE", "emoji": "\ud83d\udc43", "fill": "#f4a18a", "desc": "Your nose helps you smell yummy food and fresh flowers!!"}, "mouth": {"label": "MOUTH", "emoji": "\ud83d\udc44", "fill": "#e8607a", "desc": "Your mouth helps you eat, talk, sing and smile!!"}, "trachea": {"label": "WINDPIPE", "emoji": "\ud83c\udf99\ufe0f", "fill": "#5fb6e8", "desc": "Your windpipe is a tube that carries air down to your lungs when you breathe!!"}, "lungs": {"label": "LUNGS", "emoji": "\ud83e\udec1", "fill": "#ffb6c1", "desc": "Your lungs breathe in fresh air and send oxygen to your whole body!!"}, "heart": {"label": "HEART", "emoji": "\u2764\ufe0f", "fill": "#e63946", "desc": "Your heart pumps blood all around your body, every single second!!"}, "liver": {"label": "LIVER", "emoji": "\ud83d\udfe4", "fill": "#a0522d", "desc": "Your liver cleans your blood and helps you digest your food!!"}, "gallbladder": {"label": "GALLBLADDER", "emoji": "\ud83d\udfe2", "fill": "#9acd32", "desc": "Your gallbladder stores a juice called bile that helps you digest fatty foods!!"}, "stomach": {"label": "STOMACH", "emoji": "\ud83c\udf7d\ufe0f", "fill": "#ffb347", "desc": "Your stomach mixes and mashes your food to start digesting it!!"}, "kidney": {"label": "KIDNEYS", "emoji": "\ud83e\uded8", "fill": "#8b3a5a", "desc": "Your kidneys filter waste out of your blood and help make pee!!"}, "large_intestine": {"label": "LARGE INTESTINE", "emoji": "\ud83c\udf00", "fill": "#9acd32", "desc": "Your large intestine soaks up water from leftover food before it becomes waste!!"}, "small_intestine": {"label": "SMALL INTESTINE", "emoji": "\ud83c\udf5c", "fill": "#ff9a9e", "desc": "Your small intestine absorbs nutrients and vitamins from food into your blood!!"}, "ovary": {"label": "OVARY", "emoji": "\ud83d\udfe3", "fill": "#b56cd6", "desc": "Ovaries are special - only girls and women have them!! They make egg cells."}, "uterus": {"label": "UTERUS", "emoji": "\ud83c\udf38", "fill": "#ff9bb3", "desc": "The uterus is found only in girls and women - it is where a baby can grow!!"}};

// ── AUDIO ──
let audioCtx=null;
function getAC(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur,type,vol,delay=0){
  try{
    const ac=getAC();
    const osc=ac.createOscillator();
    const gain=ac.createGain();
    osc.type=type; osc.frequency.value=freq;
    gain.gain.value=vol;
    osc.connect(gain); gain.connect(ac.destination);
    const t=ac.currentTime+delay;
    osc.start(t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.stop(t+dur+0.02);
  }catch(e){}
}
function sndPop(){ tone(660,0.12,'sine',0.18); tone(990,0.1,'sine',0.12,0.04); }
function sndDing(){ [523,659,784,1047,1318].forEach((f,i)=>tone(f,0.3,'sine',0.22,i*0.07)); }
function sndBuzz(){ tone(180,0.18,'square',0.12); }

// ── CONFETTI BURST ──
function burstConfetti(x,y,count){
  for(let i=0;i<count;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    c.style.left=x+'px'; c.style.top=y+'px';
    const angle=Math.random()*Math.PI*2;
    const dist=60+Math.random()*140;
    const dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist - 40;
    const rot=(Math.random()*720-360)+'deg';
    const size=6+Math.random()*8;
    c.style.width=size+'px'; c.style.height=size+'px';
    if(Math.random()<0.5) c.style.borderRadius='50%';
    document.body.appendChild(c);
    requestAnimationFrame(()=>{
      c.style.transition='transform 0.9s cubic-bezier(.2,.8,.4,1), opacity 0.9s ease';
      c.style.transform=`translate(${dx}px, ${dy+160}px) rotate(${rot})`;
      c.style.opacity='0';
    });
    setTimeout(()=>c.remove(),1000);
  }
}

function showCelebration(){
  celebrate.textContent = CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)];
  celebrate.classList.remove('pop');
  void celebrate.offsetWidth;
  celebrate.classList.add('pop');
}

function showInfo(concept){
  const m=ORGANS[concept];
  document.getElementById('infoIcon').textContent = m.emoji;
  document.getElementById('infoIcon').style.background = m.fill;
  document.getElementById('infoLabel').textContent = m.label;
  document.getElementById('infoDesc').textContent = m.desc;
  infoCard.classList.add('show');
}
document.getElementById('closeInfo').onclick=()=>infoCard.classList.remove('show');

function highlightConcept(concept){
  clearHighlights();
  allHotspots().forEach(el=>{
    if(el.dataset.concept===concept){
      el.classList.add('highlight');
    } else {
      el.classList.add('dim');
    }
  });
}

// ── EXPLORE MODE ──
function onHotspotClickExplore(el){
  const concept=el.dataset.concept;
  highlightConcept(concept);
  showInfo(concept);
  const r=el.getBoundingClientRect();
  burstConfetti(r.left+r.width/2, r.top+r.height/2, 14);
  sndPop();
}

// ── QUIZ MODE ──
function nextQuestion(){
  clearHighlights();
  infoCard.classList.remove('show');
  document.getElementById('quizFeedback').textContent='';
  currentQuestion=QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
  document.getElementById('quizTarget').textContent=currentQuestion.label;
  document.getElementById('quizScore').textContent=`⭐ Score: ${quizScore} / ${quizTotal}`;
  lockInput=false;
}

function onHotspotClickQuiz(el){
  if(lockInput) return;
  const concept=el.dataset.concept;
  const isCorrect = concept===currentQuestion.concept;

  quizTotal++;
  const fb=document.getElementById('quizFeedback');

  if(isCorrect){
    quizScore++;
    allHotspots().forEach(h=>{
      if(h.dataset.concept===concept) h.classList.add('correct');
    });
    fb.textContent='✅ Yes!! Great job!!';
    fb.style.color='#fff3b0';
    lockInput=true;

    const r=el.getBoundingClientRect();
    burstConfetti(r.left+r.width/2, r.top+r.height/2, 28);
    burstConfetti(window.innerWidth/2, window.innerHeight*0.3, 24);
    showCelebration();
    sndDing();

    setTimeout(nextQuestion, 1500);
  } else {
    el.classList.add('wrong');
    setTimeout(()=>el.classList.remove('wrong'),400);
    fb.textContent = currentQuestion.hint ? ('🤔 Not quite!! '+currentQuestion.hint) : '🤔 Not quite - try again!!';
    fb.style.color='#ffd9d9';
    sndBuzz();
  }
  document.getElementById('quizScore').textContent=`⭐ Score: ${quizScore} / ${quizTotal}`;
}

// ── WIRE UP CLICKS ──
allHotspots().forEach(el=>{
  el.addEventListener('click',()=>{
    getAC();
    if(mode==='explore') onHotspotClickExplore(el);
    else onHotspotClickQuiz(el);
  });
});

// ── MODE SWITCHING ──
exploreBtn.onclick=()=>{
  mode='explore';
  exploreBtn.classList.add('active');
  quizBtn.classList.remove('active');
  quizBanner.classList.remove('show');
  clearHighlights();
  infoCard.classList.remove('show');
};
quizBtn.onclick=()=>{
  mode='quiz';
  quizBtn.classList.add('active');
  exploreBtn.classList.remove('active');
  quizBanner.classList.add('show');
  infoCard.classList.remove('show');
  quizScore=0; quizTotal=0;
  nextQuestion();
};
</script>
