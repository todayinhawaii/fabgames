<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fab Crossword 🔤 — fab.games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
#topbar{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,0.6);border-bottom:2px solid rgba(255,215,0,0.2);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.logo{font-family:'Fredoka One',cursive;font-size:22px;color:#FFD700;}
.logo span{color:#fff;font-size:14px;opacity:0.5;margin-left:4px;}
#levelBar{display:flex;gap:6px;}
.lvl-btn{font-family:'Fredoka One',cursive;font-size:12px;padding:5px 14px;border-radius:20px;border:2px solid rgba(255,255,255,0.2);cursor:pointer;background:transparent;color:rgba(255,255,255,0.6);transition:all 0.2s;}
.lvl-btn.active{background:#FFD700;color:#000;border-color:#FFD700;}
.lvl-btn.expert{border-color:rgba(255,80,80,0.4);color:rgba(255,150,150,0.8);}
.lvl-btn.expert.active{background:linear-gradient(135deg,#ff4444,#cc0000);color:#fff;border-color:#ff4444;}
#main{width:100%;max-width:1100px;padding:16px;display:flex;flex-direction:column;gap:14px;}
#btnBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{font-family:'Fredoka One',cursive;font-size:13px;padding:9px 18px;border-radius:12px;border:none;cursor:pointer;transition:all 0.2s;}
.btn-check{background:rgba(80,200,80,0.2);color:#80FF80;border:2px solid rgba(80,200,80,0.4);}
.btn-reveal{background:rgba(255,150,0,0.2);color:#FFB347;border:2px solid rgba(255,150,0,0.4);}
.btn-clear{background:rgba(200,80,80,0.2);color:#FF9999;border:2px solid rgba(200,80,80,0.4);}
.btn-next{background:#FFD700;color:#000;border:2px solid #FFD700;}
.puzzle-title{font-family:'Fredoka One',cursive;font-size:14px;color:rgba(255,215,0,0.6);}
#puzzleWrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
#gridWrap{flex-shrink:0;background:rgba(255,255,255,0.03);border-radius:16px;padding:10px;border:2px solid rgba(255,215,0,0.15);}
#grid{display:inline-grid;gap:2px;}
.cell{width:72px;height:72px;position:relative;}
.cell.black{background:#0a0a0a;border-radius:3px;}
.cell.white{background:#f0f0f0;border-radius:3px;cursor:text;}
.cell.white input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-family:'Fredoka One',cursive;font-size:32px;color:#111;text-transform:uppercase;cursor:text;outline:none;caret-color:transparent;padding:0;}
.cell.white.hi-word{background:#ffe566;}
.cell.white.hi-cell{background:#FFD700;}
.cell.white.correct{background:#1a1a2e;}
.cell.white.correct input{color:#FFD700;}
.cell.white.wrong{background:rgba(200,50,50,0.4);}
.cell.white.wrong input{color:#fff;}
.cell-num{position:absolute;top:1px;left:2px;font-size:20px;color:#444;font-family:'Nunito',sans-serif;font-weight:700;line-height:1;pointer-events:none;z-index:2;}
#cluesWrap{flex:1;min-width:260px;display:flex;gap:16px;max-height:600px;}
.clue-col{flex:1;overflow-y:auto;scrollbar-width:thin;}
.clue-col h3{font-family:'Fredoka One',cursive;font-size:20px;color:#FFD700;letter-spacing:2px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(255,215,0,0.2);position:sticky;top:0;background:#0a0a1a;z-index:1;padding-top:2px;}
.clue-item{font-size:21px;color:rgba(255,255,255,0.65);padding:8px 10px;border-radius:6px;cursor:pointer;border-left:2px solid transparent;transition:all 0.15s;line-height:1.5;margin-bottom:4px;}
.clue-item:hover{background:rgba(255,215,0,0.08);color:#FFD700;}
.clue-item.active{background:rgba(255,215,0,0.12);border-left-color:#FFD700;color:#FFD700;}
.clue-item.done{color:rgba(255,255,255,0.25);text-decoration:line-through;}
.clue-num{font-weight:700;color:#FFD700;margin-right:6px;font-size:21px;}
#winOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;align-items:center;justify-content:center;}
#winOverlay.show{display:flex;}
.win-box{background:#0d0d1a;border:3px solid #FFD700;border-radius:24px;padding:40px;text-align:center;}
.win-emoji{font-size:64px;margin-bottom:12px;}
.win-title{font-family:'Fredoka One',cursive;font-size:36px;color:#FFD700;margin-bottom:8px;}
.win-sub{font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:24px;}
#status{font-family:'Fredoka One',cursive;font-size:12px;color:rgba(255,215,0,0.4);padding:4px 0;}
@media(max-width:700px){
  #cluesWrap{flex-direction:column;max-height:300px;overflow-y:auto;}
  .clue-col{overflow-y:visible;}
  .cell{width:52px;height:52px;}
  .cell.white input{font-size:22px;}
  .cell-num{font-size:18px;}
}
</style>

  </div>
  <div id="status"></div>

    <div id="gridWrap"><div id="grid"></div></div>
    <div id="cluesWrap">

    </div>
  </div>
</div>
<div id="winOverlay">

</div>

// ══════════════════════════════════════════════════
// CROSSWORD GENERATOR ALGORITHM
// ══════════════════════════════════════════════════
function generateCrossword(wordList){
  const GRID = 20; // working grid size
  const grid = Array.from({length:GRID},()=>Array(GRID).fill(''));
  const placed = []; // {word,clue,row,col,dir}

  function canPlace(word, row, col, dir){
    const rows=GRID, cols=GRID;
    // Check BEFORE the word — must be empty
    if(dir==='across'){
      if(col>0 && grid[row][col-1]) return false;
      if(row<0||row>=rows) return false;
    } else {
      if(row>0 && grid[row-1][col]) return false;
      if(col<0||col>=cols) return false;
    }
    // Check AFTER the word — must be empty
    if(dir==='across'){
      if(col+word.length<cols && grid[row][col+word.length]) return false;
    } else {
      if(row+word.length<rows && grid[row+word.length][col]) return false;
    }
    for(let i=0;i<word.length;i++){
      const r = dir==='across' ? row : row+i;
      const c = dir==='across' ? col+i : col;
      if(r<0||r>=rows||c<0||c>=cols) return false;
      const cur = grid[r][c];
      // Must be empty or exact match
      if(cur && cur !== word[i]) return false;
      if(!cur){
        // Perpendicular neighbors: only allowed if they're part of an existing word
        if(dir==='across'){
          const above = r>0 ? grid[r-1][c] : '';
          const below = r<rows-1 ? grid[r+1][c] : '';
          if(above || below){
            // Must intersect with a placed DOWN word at this cell
            const ok = placed.some(p=>
              p.dir==='down' && p.col===c && r>=p.row && r<p.row+p.word.length
            );
            if(!ok) return false;
          }
        } else {
          const left  = c>0 ? grid[r][c-1] : '';
          const right = c<cols-1 ? grid[r][c+1] : '';
          if(left || right){
            const ok = placed.some(p=>
              p.dir==='across' && p.row===r && c>=p.col && c<p.col+p.word.length
            );
            if(!ok) return false;
          }
        }
      }
    }
    return true;
  }

  function placeWord(word, clue, row, col, dir){
    for(let i=0;i<word.length;i++){
      const r = dir==='across' ? row : row+i;
      const c = dir==='across' ? col+i : col;
      grid[r][c] = word[i];
    }
    placed.push({word,clue,row,col,dir});
  }

  function findPlacements(word){
    const opts = [];
    for(const p of placed){
      for(let pi=0;pi<p.word.length;pi++){
        for(let wi=0;wi<word.length;wi++){
          if(p.word[pi] !== word[wi]) continue;
          const newDir = p.dir==='across' ? 'down' : 'across';
          let r,c;
          if(p.dir==='across'){
            r = p.row - wi;
            c = p.col + pi;
          } else {
            r = p.row + pi;
            c = p.col - wi;
          }
          if(canPlace(word,r,c,newDir)){
            // Score: prefer more intersections
            let score = 0;
            for(let i=0;i<word.length;i++){
              const tr=newDir==='across'?r:r+i;
              const tc=newDir==='across'?c+i:c;
              if(grid[tr][tc]) score++;
            }
            opts.push({r,c,dir:newDir,score});
          }
        }
      }
    }
    opts.sort((a,b)=>b.score-a.score);
    return opts;
  }

  // Place first word in center going across
  const words = [...wordList].sort((a,b)=>b.w.length-a.w.length);
  const first = words[0];
  const startC = Math.floor((GRID - first.w.length)/2);
  const startR = Math.floor(GRID/2);
  placeWord(first.w, first.c, startR, startC, 'across');

  // Place remaining words
  for(let i=1;i<words.length;i++){
    const {w,c} = words[i];
    const opts = findPlacements(w);
    if(opts.length>0){
      const best = opts[0];
      placeWord(w, c, best.r, best.c, best.dir);
    }
  }

  // Trim grid to content
  let minR=GRID,maxR=0,minC=GRID,maxC=0;
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    if(grid[r][c]){minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c);}
  }
  const trimmed = [];
  for(let r=minR;r<=maxR;r++){
    const row=[];
    for(let c=minC;c<=maxC;c++) row.push(grid[r][c]||'#');
    trimmed.push(row);
  }

  // Adjust placed word positions
  const adjustedPlaced = placed.map(p=>({
    ...p,
    row: p.row-minR,
    col: p.col-minC
  }));

  return {grid:trimmed, placed:adjustedPlaced};
}

// Number the cells and build clue lists
function numberGrid(grid, placed){
  const rows=grid.length, cols=grid[0].length;
  const nums={};
  let n=1;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(grid[r][c]==='#') continue;
    const sA=(c===0||grid[r][c-1]==='#')&&c+1<cols&&grid[r][c+1]!=='#';
    const sD=(r===0||grid[r-1]===undefined||grid[r-1][c]==='#')&&r+1<rows&&grid[r+1][c]!=='#';
    if(sA||sD) nums[`${r},${c}`]=n++;
  }
  const across=[], down=[];
  for(const p of placed){
    const num = nums[`${p.row},${p.col}`];
    if(!num) continue;
    (p.dir==='across'?across:down).push({
      num, row:p.row, col:p.col, len:p.word.length,
      clue:p.clue, word:p.word, dir:p.dir
    });
  }
  across.sort((a,b)=>a.num-b.num);
  down.sort((a,b)=>a.num-b.num);
  return {nums, across, down};
}

// ── STATE ─────────────────────────────────────────
let lv='easy', idx=0, puzData=null;
let gr=[], nums={}, clues={across:[],down:[]};
let selR=null,selC=null,dir='across',selClue=null;
let revealed=false, savedAnswers=null;

function setLevel(l){
  lv=l; idx=0;
  document.querySelectorAll('.lvl-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.lvl-btn[onclick="setLevel('${l}')"]`).classList.add('active');
  loadPuzzle();
}
function nextPuzzle(){
  idx=(idx+1)%WORD_BANKS[lv].length;
  loadPuzzle();
}

function loadPuzzle(){
  const bank = WORD_BANKS[lv][idx];
  document.getElementById('ptitle').textContent = bank.title+' ('+(idx+1)+'/'+WORD_BANKS[lv].length+')';
  document.getElementById('status').textContent = '⚙️ Generating puzzle...';
  
  // Generate with slight delay so UI updates
  setTimeout(()=>{
    puzData = generateCrossword(bank.words);
    gr = puzData.grid;
    const numbered = numberGrid(gr, puzData.placed);
    nums = numbered.nums;
    clues = {across:numbered.across, down:numbered.down};
    
    const placed = puzData.placed.length;
    const total = bank.words.length;
    document.getElementById('status').textContent = 
      `✅ ${placed} of ${total} words placed • ${gr[0].length}×${gr.length} grid`;
    
    selR=null; selC=null; dir='across'; selClue=null;
    revealed=false; savedAnswers=null;
    resetRevBtn();
    renderGrid();
    renderClues();
  }, 50);
}

function renderGrid(){
  const g=document.getElementById('grid');
  const rows=gr.length, cols=gr[0].length;
  g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  g.innerHTML='';
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const div=document.createElement('div');
    const blk=gr[r][c]==='#';
    div.className='cell '+(blk?'black':'white');
    div.dataset.r=r; div.dataset.c=c;
    if(!blk){
      if(nums[`${r},${c}`]){
        const ns=document.createElement('div');
        ns.className='cell-num';
        ns.textContent=nums[`${r},${c}`];
        div.appendChild(ns);
      }
      const inp=document.createElement('input');
      inp.maxLength=1; inp.dataset.r=r; inp.dataset.c=c;
      inp.addEventListener('focus',()=>selectCell(r,c));
      inp.addEventListener('keydown',e=>handleKey(e,r,c));
      inp.addEventListener('input',e=>handleInput(e,r,c));
      div.appendChild(inp);
      div.addEventListener('click',()=>{
        if(selR===r&&selC===c) toggleDir();
        else selectCell(r,c);
      });
    }
    g.appendChild(div);
  }
}

function renderClues(){
  ['across','down'].forEach(d=>{
    const el=document.getElementById(d==='across'?'acList':'dnList');
    el.innerHTML='';
    clues[d].forEach(cl=>{
      const div=document.createElement('div');
      div.className='clue-item';
      div.dataset.dir=d; div.dataset.num=cl.num;
      div.innerHTML=`<span class="clue-num">${cl.num}${d==='across'?'A':'D'}</span>${cl.clue}`;
      div.onclick=()=>jumpToClue(cl,d);
      el.appendChild(div);
    });
  });
}

// ── SELECTION ─────────────────────────────────────
function selectCell(r,c){
  if(!gr[r]||gr[r][c]==='#') return;
  selR=r; selC=c;
  clearHighlights();
  const cl=findClue(r,c,dir)||findClue(r,c,dir==='across'?'down':'across');
  if(cl){ dir=cl._d; selClue=cl; highlightWord(cl); activateClue(cl.num,cl._d); }
  document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`)?.classList.add('hi-cell');
  document.querySelector(`input[data-r="${r}"][data-c="${c}"]`)?.focus();
}
function clearHighlights(){
  document.querySelectorAll('.cell.white').forEach(el=>el.classList.remove('hi-cell','hi-word'));
}
function highlightWord(cl){
  for(let i=0;i<cl.len;i++){
    const r=cl._d==='across'?cl.row:cl.row+i;
    const c=cl._d==='across'?cl.col+i:cl.col;
    document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`)?.classList.add('hi-word');
  }
}
function activateClue(num,d){
  document.querySelectorAll('.clue-item').forEach(el=>{
    el.classList.remove('active');
    if(+el.dataset.num===num&&el.dataset.dir===d) el.classList.add('active');
  });
  document.querySelector('.clue-item.active')?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function findClue(r,c,d){
  for(const cl of clues[d]){
    if(d==='across'&&cl.row===r&&c>=cl.col&&c<cl.col+cl.len) return{...cl,_d:d};
    if(d==='down'&&cl.col===c&&r>=cl.row&&r<cl.row+cl.len) return{...cl,_d:d};
  }
  return null;
}
function toggleDir(){ dir=dir==='across'?'down':'across'; if(selR!==null)selectCell(selR,selC); }
function jumpToClue(cl,d){ dir=d; selClue={...cl,_d:d}; selectCell(cl.row,cl.col); }

// ── KEYBOARD ──────────────────────────────────────
function handleKey(e,r,c){
  const rows=gr.length,cols=gr[0].length;
  if(e.key==='Backspace'){
    e.preventDefault();
    const inp=document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
    if(inp&&inp.value){ inp.value=''; checkWin(); return; }
    moveCursor(r,c,-1); return;
  }
  const arrows={ArrowRight:[0,1,'across'],ArrowLeft:[0,-1,'across'],ArrowDown:[1,0,'down'],ArrowUp:[-1,0,'down']};
  if(arrows[e.key]){
    e.preventDefault();
    const [dr,dc,nd]=arrows[e.key]; dir=nd;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&gr[nr][nc]!=='#') selectCell(nr,nc);
    return;
  }
  if(e.key==='Tab'){ e.preventDefault(); tabClue(e.shiftKey); }
}
function handleInput(e,r,c){
  const inp=e.target;
  inp.value=inp.value.replace(/[^a-zA-Z]/g,'').toUpperCase().slice(-1);
  if(inp.value) moveCursor(r,c,1);
  checkWin();
}
function moveCursor(r,c,d){
  const rows=gr.length,cols=gr[0].length;
  let nr=r,nc=c;
  if(dir==='across') nc+=d; else nr+=d;
  if(nr<0||nr>=rows||nc<0||nc>=cols||gr[nr][nc]==='#') return;
  selectCell(nr,nc);
}
function tabClue(prev){
  const all=[...clues.across.map(cl=>({...cl,_d:'across'})),...clues.down.map(cl=>({...cl,_d:'down'}))];
  const i=all.findIndex(cl=>cl.num===selClue?.num&&cl._d===dir);
  const next=all[(i+(prev?-1:1)+all.length)%all.length];
  dir=next._d; selClue=next; selectCell(next.row,next.col);
}

// ── CHECK / REVEAL / CLEAR ────────────────────────
function checkAll(){
  const rows=gr.length,cols=gr[0].length;
  let correct=0,total=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(gr[r][c]==='#') continue; total++;
    const inp=document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
    const cell=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    cell.classList.remove('correct','wrong');
    if(!inp||!inp.value) continue;
    if(inp.value===gr[r][c]){ cell.classList.add('correct'); correct++; }
    else cell.classList.add('wrong');
  }
  document.getElementById('status').textContent=`✓ ${correct}/${total} letters correct`;
}
function toggleReveal(){
  const rows=gr.length,cols=gr[0].length;
  const btn=document.getElementById('revealBtn');
  if(!revealed){
    savedAnswers={};
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(gr[r][c]==='#') continue;
      const inp=document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      if(inp) savedAnswers[`${r},${c}`]=inp.value;
    }
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(gr[r][c]==='#') continue;
      const inp=document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      const cell=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if(inp){ inp.value=gr[r][c]; cell.classList.add('correct'); cell.classList.remove('wrong'); }
    }
    revealed=true;
    btn.textContent='🙈 Hide Answers';
    btn.style.cssText='background:rgba(150,80,255,0.25);color:#CC99FF;border:2px solid rgba(150,80,255,0.5);';
  } else {
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(gr[r][c]==='#') continue;
      const inp=document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      const cell=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if(inp){ inp.value=savedAnswers?.[`${r},${c}`]||''; cell.classList.remove('correct','wrong'); }
    }
    revealed=false; savedAnswers=null; resetRevBtn();
  }
}
function clearAll(){
  document.querySelectorAll('#grid input').forEach(i=>i.value='');
  document.querySelectorAll('.cell').forEach(el=>el.classList.remove('correct','wrong'));
  revealed=false; savedAnswers=null; resetRevBtn();
  document.getElementById('status').textContent='';
}
function resetRevBtn(){
  const btn=document.getElementById('revealBtn');
  if(btn){ btn.textContent='💡 Reveal'; btn.style.cssText=''; }
}
function checkWin(){
  const rows=gr.length,cols=gr[0].length;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(gr[r][c]==='#') continue;
    const inp=document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
    if(!inp||inp.value!==gr[r][c]) return;
  }
  const msgs=['Brilliant! 🌟','Amazing work! 🎯','You crushed it! 💪','Wordsmith! 📝','Genius! 🧠'];
  document.getElementById('winSub').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('winOverlay').classList.add('show');
}

loadPuzzle();
</script>
