<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teapot Guinea Pigs 🫖 — fab.games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#FFD700;
  --pink:#ff8fc4;
  --cream:#fff6ea;
  --green:#5c9c1e;
}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(160deg,#2e5c1e 0%,#3d7a26 50%,#264d18 100%);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  position:relative;
}
#topbar,#main{position:relative;z-index:2;}
#flyingTeapots{
  position:fixed;inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
#flyingTeapots img{
  position:absolute;
  object-fit:contain;
  opacity:0.8;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,0.3));
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
@keyframes teapotFloatA{0%{transform:translate(-15vw,110vh) rotate(0deg);}100%{transform:translate(115vw,-15vh) rotate(360deg);}}
@keyframes teapotFloatB{0%{transform:translate(115vw,105vh) rotate(0deg);}100%{transform:translate(-15vw,-10vh) rotate(-360deg);}}
@keyframes teapotFloatC{0%{transform:translate(-15vw,-10vh) rotate(0deg);}100%{transform:translate(115vw,105vh) rotate(360deg);}}
@keyframes teapotFloatD{0%{transform:translate(115vw,-15vh) rotate(0deg);}100%{transform:translate(-15vw,110vh) rotate(-360deg);}}
#topbar{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 16px;}
.logo{
  font-family:'Fredoka One',cursive;font-size:26px;
  color:#ffffff;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));
  letter-spacing:1px;
}
#scorePanel{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
.score-pill{
  font-family:'Fredoka One',cursive;font-size:19px;color:#ffe566;
  background:linear-gradient(180deg,#4a9c2e,#2e6e1a);padding:10px 24px;border-radius:29px;
  border:2px solid #ffd700;white-space:nowrap;
  box-shadow:0 3px 0 #1a4a0e;
}
#endBtn{
  font-family:'Fredoka One',cursive;font-size:19px;color:#ffe566;
  padding:10px 24px;border-radius:29px;border:2px solid #ffd700;
  cursor:pointer;background:linear-gradient(180deg,#4a9c2e,#2e6e1a);
  box-shadow:0 3px 0 #1a4a0e;
}
#main{width:100%;max-width:820px;padding:0 16px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;}

#statusBar{
  width:100%;padding:12px 18px;
  background:rgba(255,255,255,0.55);border-radius:16px;
  border:1px solid rgba(255,95,168,0.35);
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
}
#statusMsg{font-family:'Fredoka One',cursive;font-size:19px;color:#8a2f5c;}
#progressBar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:400px;}
.prog-dot{
  width:11px;height:11px;border-radius:50%;
  border:2px solid rgba(200,32,110,0.35);
  background:transparent;transition:all 0.3s;
}
.prog-dot.done{background:#c8206e;border-color:#c8206e;}
#playBtn{
  font-family:'Fredoka One',cursive;font-size:19px;
  padding:10px 30px;border-radius:29px;border:2px solid #ffd700;cursor:pointer;
  background:linear-gradient(180deg,#4a9c2e,#2e6e1a);
  color:#ffe566;box-shadow:0 4px 0 #1a4a0e;
  margin-top:4px;
  transition:transform 0.15s, opacity 0.2s;
}
#playBtn:hover{transform:scale(1.05);}
#playBtn.hidden{display:none;}

/* ── SCENE ── */
#scene{
  position:relative;
  width:100%;
  max-width:760px;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 14px 50px rgba(120,30,70,0.35);
  border:4px solid rgba(255,255,255,0.7);
}
#sceneBg{width:100%;display:block;}
#sceneOverlay{
  position:absolute;inset:0;
  background:rgba(20,10,15,0.42);
  pointer-events:none;
}
#promptPill{
  position:absolute;
  top:5%; left:50%; transform:translateX(-50%);
  font-family:'Fredoka One',cursive;font-size:clamp(15px,3.2vw,24px);
  color:#ffe566;
  background:linear-gradient(180deg,#4a9c2e,#2e6e1a);
  padding:10px 26px;border-radius:30px;
  border:3px solid #ffd700;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  text-align:center;
  white-space:nowrap;
  z-index:10;
}
#grid{
  position:absolute;
  left:6%; top:13%; width:88%; height:83%;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  grid-template-rows:repeat(4, 1fr);
  column-gap:2%;
  row-gap:5%;
}
.cell{
  position:relative;
  perspective:900px;
  cursor:pointer;
}
.cell-inner{width:100%;height:100%;position:relative;}
.teapot-img{
  position:absolute;left:50%;top:50%;
  width:117%;height:117%;
  object-fit:contain;
  user-select:none;pointer-events:none;
  transform:translate(-50%,-50%);
  transition:transform 0.55s cubic-bezier(.4,.2,.2,1), opacity 0.55s;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,0.3));
  transform-origin:center;
  z-index:3;
}
.cell.open .teapot-img{ transform:translate(-50%,-50%) rotateY(150deg) scale(0.6); opacity:0; }
.pig-wrap{
  position:absolute;left:50%;top:50%;
  width:85%;height:85%;
  opacity:0;
  transform:translate(-50%,-50%) scale(0.7);
  transition:opacity 0.4s 0.15s, transform 0.4s 0.15s;
  z-index:2;
}
.cell.open .pig-wrap{ opacity:1; transform:translate(-50%,-50%) scale(1); }
.pig-frame{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:contain;
  user-select:none;pointer-events:none;
  opacity:1;
  transition:opacity 0.1s linear;
}
.pig-frame.frame-b{ opacity:0; }
.cell.blink .pig-frame.frame-a{ opacity:0; }
.cell.blink .pig-frame.frame-b{ opacity:1; }
.name-tag{
  position:absolute; bottom:-6%; left:50%; transform:translateX(-50%) scale(0);
  font-family:'Fredoka One',cursive; font-size:22px; color:#8a2f5c;
  background:var(--cream); padding:5px 15px; border-radius:16px;
  border:2px solid var(--pink); white-space:nowrap;
  transition:transform 0.3s 0.35s;
  z-index:4;
}
.cell.open .name-tag{ transform:translateX(-50%) scale(1); }
.cell.correct-flash .teapot-img{ filter:drop-shadow(0 0 14px rgba(63,206,0,0.9)); }
.cell.wrong-flash .teapot-img{ animation:shakeTeapot 0.4s; }
@keyframes shakeTeapot{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}

#feedbackMsg{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-family:'Fredoka One',cursive;font-size:34px;
  padding:16px 36px;border-radius:28px;z-index:999;
  pointer-events:none;opacity:0;
  transition:transform 0.15s,opacity 0.3s;text-align:center;
  color:#1a0800;box-shadow:0 8px 40px rgba(0,0,0,0.5);
}
#feedbackMsg.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
#feedbackMsg.good{background:linear-gradient(135deg,#c8ffb0,#3fce00);}
#feedbackMsg.bad{background:linear-gradient(135deg,#ffb0b0,#ff4040);}

#celebrationLayer{position:fixed;inset:0;z-index:600;pointer-events:none;overflow:hidden;}
.confetti-piece{position:absolute;top:50%;left:50%;font-size:28px;will-change:transform,opacity;animation:confettiBurst 1.4s ease-out forwards;}
@keyframes confettiBurst{
  0%{transform:translate(-50%,-50%) scale(0.4) rotate(0deg);opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot));opacity:0;}
}
#flashLayer{position:fixed;inset:0;z-index:590;pointer-events:none;background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,215,0,0) 60%);opacity:0;}
#flashLayer.flash{animation:flashPop 0.5s ease-out;}
@keyframes flashPop{0%{opacity:0.9;}100%{opacity:0;}}

/* ── WIN OVERLAY ── */
#winOverlay{display:none;position:fixed;inset:0;background:rgba(90,20,50,0.85);z-index:500;align-items:center;justify-content:center;}
#winOverlay.show{display:flex;}
.win-box{
  background:linear-gradient(135deg,#fff2f8,#ffe0ef);
  border:3px solid var(--pink);border-radius:28px;
  padding:40px;text-align:center;max-width:420px;width:90%;
}
.win-emoji{font-size:60px;margin-bottom:10px;}
.win-title{font-family:'Fredoka One',cursive;font-size:28px;color:#c8206e;margin-bottom:8px;}
.win-sub{font-size:15px;color:#8a2f5c;margin-bottom:22px;}
.win-btn{
  font-family:'Fredoka One',cursive;font-size:18px;
  padding:12px 28px;border-radius:14px;border:2px solid #ffd700;cursor:pointer;
  background:linear-gradient(180deg,#4a9c2e,#2e6e1a);
  color:#ffe566;box-shadow:0 4px 0 #1a4a0e;margin:0 6px;
}

@media(max-width:640px){
  .logo{font-size:20px;}
  #statusMsg{font-size:15px;}
  .name-tag{font-size:17px;padding:3px 10px;}
}
</style>
</head>
<body>

<div id="flyingTeapots">
  <img src="/TEAPOT.1.png" style="width:60px;animation:teapotFloatA 22s linear infinite;animation-delay:-2s;">
  <img src="/TEAPOT.3.png" style="width:85px;animation:teapotFloatB 28s linear infinite;animation-delay:-9s;">
  <img src="/TEAPOT.5.png" style="width:50px;animation:teapotFloatC 18s linear infinite;animation-delay:-4s;">
  <img src="/TEAPOT.7.png" style="width:75px;animation:teapotFloatD 25s linear infinite;animation-delay:-14s;">
  <img src="/TEAPOT.9.png" style="width:65px;animation:teapotFloatA 20s linear infinite;animation-delay:-11s;">
  <img src="/TEAPOT.11.png" style="width:90px;animation:teapotFloatB 32s linear infinite;animation-delay:-3s;">
  <img src="/TEAPOT.2.png" style="width:55px;animation:teapotFloatC 24s linear infinite;animation-delay:-17s;">
  <img src="/TEAPOT.4.png" style="width:80px;animation:teapotFloatD 21s linear infinite;animation-delay:-6s;">
  <img src="/TEAPOT.6.png" style="width:45px;animation:teapotFloatA 26s linear infinite;animation-delay:-19s;">
  <img src="/TEAPOT.8.png" style="width:70px;animation:teapotFloatB 19s linear infinite;animation-delay:-8s;">
</div>

<div id="topbar">
  <div class="logo">🫖 Teapot Guinea Pigs</div>
  <div id="scorePanel">
    <div class="score-pill">⭐ <span id="totalScore">0</span> pts</div>
    <div class="score-pill">🏆 Best <span id="bestScore">0</span></div>
    <div class="score-pill">🔄 Round <span id="roundNum">1</span></div>
    <button id="endBtn" onclick="endGame()">🏁 End Game</button>
  </div>
</div>

<div id="main">
  <div id="statusBar">
    <div id="statusMsg">🫖 To improve memory, study each guinea pig and what teapot they are hiding behind. When you are ready, click Play!</div>
    <div id="progressBar"></div>
    <button id="playBtn" onclick="startQuizPhase()">▶ Play!</button>
  </div>

  <div id="scene">
    <img id="sceneBg" src="/teapot-background.jpg" alt="Teapot garden">
    <div id="sceneOverlay"></div>
    <div id="promptPill">Study, then click Play!</div>
    <div id="grid"></div>
  </div>
</div>

<div id="feedbackMsg"></div>
<div id="flashLayer"></div>
<div id="celebrationLayer"></div>

<div id="winOverlay">
  <div class="win-box">
    <div class="win-emoji">🎉</div>
    <div class="win-title">You found everyone!</div>
    <div class="win-sub" id="winSub">All 12 guinea pigs remembered!</div>
    <button class="win-btn" onclick="reshuffleAndRestart()">🔄 Play Again</button>
  </div>
</div>

<script>
// ── GUINEA PIGS ─────────────────────────────────────
const NAMES = ['Pudding','Muffin','Biscuit','Waffles','Toffee','Truffle',
                'Pipkin','Peaches','Buttons','Niblet','Pickles','Honeybun'];

// ── STATE ─────────────────────────────────────────
let assignment = [];      // assignment[cellIndex] = guinea pig name for that cell
let phase = 'reveal';     // 'reveal' | 'quiz'
let visited = new Set();  // cells visited during reveal phase
let openCell = null;      // currently open cell index (either phase)
let quizPool = [];        // names left to ask this quiz round
let currentTarget = null; // name currently being asked for
let round = 1;
let totalScore = 0;
let bestScore = 0;
let startTime = null;
let blinkTimers = {};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ── SETUP ─────────────────────────────────────────
function preloadAllPigs(){
  NAMES.forEach(name=>{
    const n = name.toLowerCase();
    new Image().src = '/'+n+'.1.png';
    new Image().src = '/'+n+'.2.png';
  });
}

function newGame(){
  assignment = shuffle(NAMES);
  phase = 'reveal';
  visited = new Set();
  openCell = null;
  buildGrid();
  preloadAllPigs();
  document.getElementById('statusMsg').textContent = '🫖 To improve memory, study each guinea pig and what teapot they are hiding behind. When you are ready, click Play!';
  document.getElementById('promptPill').textContent = 'Study, then click Play!';
  document.getElementById('playBtn').classList.remove('hidden');
  buildProgress(0, 12);
  document.getElementById('winOverlay').classList.remove('show');
}

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  Object.values(blinkTimers).forEach(t=>clearInterval(t));
  blinkTimers = {};

  for(let i=0;i<12;i++){
    const name = assignment[i];
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = 'cell-'+i;
    cell.dataset.index = i;

    cell.innerHTML =
      '<div class="cell-inner">'+
        '<div class="pig-wrap">'+
          '<img class="pig-frame frame-a" id="pig-'+i+'-a" src="/'+name.toLowerCase()+'.1.png" alt="'+name+'">'+
          '<img class="pig-frame frame-b" id="pig-'+i+'-b" src="/'+name.toLowerCase()+'.2.png" alt="'+name+'">'+
        '</div>'+
        '<img class="teapot-img" src="/TEAPOT.'+(i+1)+'.png" alt="Teapot">'+
        '<div class="name-tag">'+name+'</div>'+
      '</div>';

    cell.addEventListener('click', ()=>onCellClick(i));
    grid.appendChild(cell);
  }
}

function buildProgress(done, total){
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for(let i=0;i<total;i++){
    const dot = document.createElement('div');
    dot.className = 'prog-dot'+(i<done?' done':'');
    bar.appendChild(dot);
  }
}

// ── CLICK HANDLING ──────────────────────────────────
function onCellClick(i){
  if(phase === 'reveal') handleRevealClick(i);
  else handleQuizClick(i);
}

function openCellAt(i){
  if(openCell !== null && openCell !== i){
    document.getElementById('cell-'+openCell)?.classList.remove('open');
    stopBlink(openCell);
  }
  document.getElementById('cell-'+i).classList.add('open');
  openCell = i;
  startBlink(i);
}

function closeCellAt(i){
  document.getElementById('cell-'+i)?.classList.remove('open');
  stopBlink(i);
  if(openCell === i) openCell = null;
}

function startBlink(i){
  stopBlink(i);
  const cell = document.getElementById('cell-'+i);
  const doBlink = ()=>{
    if(!cell) return;
    cell.classList.add('blink');
    setTimeout(()=>cell.classList.remove('blink'), 320);
  };
  setTimeout(doBlink, 250);
  blinkTimers[i] = setInterval(doBlink, 1000);
}

function stopBlink(i){
  if(blinkTimers[i]){ clearInterval(blinkTimers[i]); delete blinkTimers[i]; }
}

function handleRevealClick(i){
  openCellAt(i);
  if(!visited.has(i)){
    visited.add(i);
    buildProgress(visited.size, 12);
  }
  if(visited.size >= 12){
    document.getElementById('statusMsg').textContent = "You've met everyone! Tap Play when you're ready!";
    document.getElementById('promptPill').textContent = "Tap Play when ready!";
  }
}

function startQuizPhase(){
  if(phase === 'quiz') return; // already in quiz, ignore duplicate clicks
  phase = 'quiz';
  document.getElementById('playBtn').classList.add('hidden');
  if(openCell !== null) closeCellAt(openCell);
  quizPool = shuffle(NAMES);
  buildProgress(0, 12);
  nextQuestion();
}

function nextQuestion(){
  if(quizPool.length === 0){
    return roundComplete();
  }
  currentTarget = quizPool.pop();
  startTime = Date.now();
  const phrases = ['Where is', 'Can you find'];
  const p = phrases[Math.floor(Math.random()*phrases.length)];
  document.getElementById('statusMsg').textContent = '🔍 '+p+' '+currentTarget+'?';
  document.getElementById('promptPill').textContent = p+' '+currentTarget+'?';
}

function handleQuizClick(i){
  if(openCell !== null) return; // wait for current reveal to finish
  const name = assignment[i];
  openCellAt(i);

  if(name === currentTarget){
    document.getElementById('cell-'+i).classList.add('correct-flash');
    const elapsed = Math.round((Date.now()-startTime)/1000);
    const pts = 20 + Math.max(0, 15-elapsed);
    totalScore += pts;
    if(totalScore > bestScore) bestScore = totalScore;
    document.getElementById('totalScore').textContent = totalScore;
    document.getElementById('bestScore').textContent = bestScore;
    showFeedback('Yess good job !', true, 1200);
    playRight();
    buildProgress(12-quizPool.length, 12);

    setTimeout(()=>{
      document.getElementById('cell-'+i).classList.remove('correct-flash');
      closeCellAt(i);
      nextQuestion();
    }, 1300);
  } else {
    document.getElementById('cell-'+i).classList.add('wrong-flash');
    showFeedback('Oops! Try again', false, 1100);
    playWrong();
    setTimeout(()=>{
      document.getElementById('cell-'+i).classList.remove('wrong-flash');
      closeCellAt(i);
      // currentTarget stays the same — they try again
    }, 1200);
  }
}

function roundComplete(){
  document.getElementById('winSub').textContent =
    'All 12 guinea pigs remembered! Round '+round+' complete.';
  document.getElementById('winOverlay').classList.add('show');
  bigCelebration();
}

function reshuffleAndRestart(){
  round++;
  document.getElementById('roundNum').textContent = round;
  newGame();
}

function endGame(){
  alert('Sweet game! You scored '+totalScore+' points finding the guinea pigs!');
  totalScore = 0; round = 1;
  document.getElementById('totalScore').textContent = 0;
  document.getElementById('roundNum').textContent = 1;
  newGame();
}

// ── VEGAS-STYLE CELEBRATION ─────────────────────────
function bigCelebration(){
  const flash = document.getElementById('flashLayer');
  flash.classList.remove('flash'); void flash.offsetWidth; flash.classList.add('flash');

  const layer = document.getElementById('celebrationLayer');
  const emojis = ['⭐','🎉','✨','💗','🌟','🫖'];
  const count = 50;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const angle = Math.random()*Math.PI*2;
    const dist = 220 + Math.random()*380;
    piece.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    piece.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
    piece.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    piece.style.left = '50%'; piece.style.top='40%';
    piece.style.fontSize = (18+Math.random()*22)+'px';
    piece.style.animationDelay = (Math.random()*0.15)+'s';
    layer.appendChild(piece);
    setTimeout(()=>piece.remove(), 1700);
  }
  playCelebrate();
}

// ── SOUNDS ────────────────────────────────────────
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playRight(){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sine';o.frequency.setValueAtTime(700,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(1000,audioCtx.currentTime+0.12);
  g.gain.setValueAtTime(0.22,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.18);
  o.start();o.stop(audioCtx.currentTime+0.18);
}
function playWrong(){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sawtooth';o.frequency.setValueAtTime(220,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(120,audioCtx.currentTime+0.3);
  g.gain.setValueAtTime(0.18,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.35);
  o.start();o.stop(audioCtx.currentTime+0.35);
}
function playCelebrate(){
  [523,659,784,1047,1319,1568].forEach((f,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sine';o.frequency.value=f;
    const t=audioCtx.currentTime+i*0.08;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.28,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.start(t);o.stop(t+0.3);
  });
}
function showFeedback(msg, good, duration){
  const el=document.getElementById('feedbackMsg');
  el.className='';el.textContent='';
  void el.offsetWidth;
  el.textContent=msg;
  el.className='show '+(good?'good':'bad');
  setTimeout(()=>el.classList.remove('show'), duration||700);
}

// ── START ─────────────────────────────────────────
newGame();
</script>
</body>
</html>
