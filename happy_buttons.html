<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Happy Buttons 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Baloo 2',sans-serif;
  touch-action:none;
  background:#c8bfb0;
}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;
  background:rgba(22,16,12,0.92);backdrop-filter:blur(6px);
  border-bottom:2px solid rgba(255,215,0,0.3);
}
.logo{
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;
  background:linear-gradient(135deg,#ffd700,#ffb347,#ff8fab);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.home-link{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,215,0,0.35);
  color:#e8c96a;text-decoration:none;font-size:16px;
}

/* ── STAGE ── */
#stage{
  position:fixed;top:50px;bottom:80px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* ── GRID ── */
#grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:10px;
  background:linear-gradient(145deg,#b0a498,#c8bfb0);
  border-radius:20px;
  box-shadow:
    0 12px 40px rgba(0,0,0,0.45),
    0 0 0 3px rgba(255,255,255,0.15),
    inset 0 2px 6px rgba(0,0,0,0.2);
}

/* ── EACH BUTTON ── */
.sqbtn{
  position:relative;
  border-radius:16px;
  cursor:pointer;
  overflow:hidden;

  /* 3D RAISED */
  box-shadow:
    0 7px 0 rgba(0,0,0,0.30),
    0 10px 18px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.45),
    inset 0 -2px 4px rgba(0,0,0,0.12);

  transform:translateY(0px);
  transition:
    transform 0.07s cubic-bezier(.35,0,.2,1),
    box-shadow 0.07s cubic-bezier(.35,0,.2,1),
    filter 0.07s;
  will-change:transform,box-shadow;
}
.sqbtn img{
  display:block;width:100%;height:100%;
  object-fit:cover;border-radius:14px;
  pointer-events:none;
  -webkit-user-drag:none;
}

/* ── PRESSED STATE ── */
.sqbtn.pressed{
  transform:translateY(6px) scale(0.96);
  box-shadow:
    0 1px 0 rgba(0,0,0,0.28),
    0 2px 6px rgba(0,0,0,0.20),
    inset 0 5px 14px rgba(0,0,0,0.32),
    inset 0 2px 4px rgba(0,0,0,0.18);
  filter:brightness(0.86) saturate(1.2);
}

/* Glow ring on press */
.sqbtn::after{
  content:'';
  position:absolute;inset:0;border-radius:14px;
  opacity:0;pointer-events:none;
  transition:opacity 0.1s;
  box-shadow:0 0 0 3px var(--glow,#ffd700), 0 0 20px var(--glow,#ffd700);
}
.sqbtn.pressed::after{ opacity:1; }

/* ── SOUND BAR ── */
#soundBar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:7px 10px 10px;
  background:rgba(22,16,12,0.94);backdrop-filter:blur(8px);
  border-top:2px solid rgba(255,215,0,0.28);
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
#soundLabel{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,215,0,0.65);font-weight:800;
}
#soundScroll{
  display:flex;gap:7px;overflow-x:auto;width:100%;
  padding:1px 2px;scrollbar-width:none;
}
#soundScroll::-webkit-scrollbar{display:none;}
.snd-btn{
  flex-shrink:0;padding:5px 13px;border-radius:20px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11px;
  background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.14);
  color:rgba(255,255,255,0.65);cursor:pointer;white-space:nowrap;
  transition:all 0.12s;
}
.snd-btn.active{
  background:linear-gradient(135deg,#ffd700,#ffb347);
  border-color:#fff3b0;color:#1a1a1a;
  box-shadow:0 0 12px rgba(255,215,0,0.45);
}

/* Particles */
.particle{position:fixed;pointer-events:none;z-index:60;border-radius:50%;}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">🐾 Happy Buttons</div>
  <a href="/" class="home-link">🏠</a>
</div>

<div id="stage">
  <div id="grid"></div>
</div>

<div id="soundBar">
  <div id="soundLabel">🔊 Choose your sound</div>
  <div id="soundScroll"></div>
</div>

<script>
// ── BUTTON DATA ───────────────────────────────────────
const BUTTONS=[
  {name:'Bunny',  file:'btn_00_bunny.jpg',    glow:'#ffb3c6'},
  {name:'Panda',  file:'btn_01_panda.jpg',    glow:'#c8e6c9'},
  {name:'Penguin',file:'btn_02_penguin.jpg',  glow:'#bbdefb'},
  {name:'Bear',   file:'btn_03_bear.jpg',     glow:'#ffe0b2'},
  {name:'Duck',   file:'btn_04_duck.jpg',     glow:'#fff9c4'},
  {name:'Frog',   file:'btn_05_frog.jpg',     glow:'#c5e1a5'},
  {name:'Fox',    file:'btn_06_fox.jpg',      glow:'#ffccbc'},
  {name:'Koala',  file:'btn_07_koala.jpg',    glow:'#d7ccc8'},
  {name:'Hippo',  file:'btn_08_hippo.jpg',    glow:'#ce93d8'},
  {name:'Giraffe',file:'btn_09_giraffe.jpg',  glow:'#ffe082'},
  {name:'Elephant',file:'btn_10_elephant.jpg',glow:'#b3e5fc'},
  {name:'Cat',    file:'btn_11_cat.jpg',      glow:'#f8bbd0'},
  {name:'Seal',   file:'btn_12_seal.jpg',     glow:'#e0f7fa'},
  {name:'Unicorn',file:'btn_13_unicorn.jpg',  glow:'#f3e5f5'},
  {name:'Lion',   file:'btn_14_lion.jpg',     glow:'#ffe0b2'},
  {name:'Pig',    file:'btn_15_pig.jpg',      glow:'#fce4ec'},
  {name:'Sloth',  file:'btn_16_sloth.jpg',    glow:'#d7ccc8'},
  {name:'Hedgehog',file:'btn_17_hedgehog.jpg',glow:'#dcedc8'},
  {name:'Dino',   file:'btn_18_dino.jpg',     glow:'#b2dfdb'},
  {name:'Otter',  file:'btn_19_otter.jpg',    glow:'#ffe0b2'},
  {name:'Bee',    file:'btn_20_bee.jpg',      glow:'#fff9c4'},
  {name:'Sheep',  file:'btn_21_sheep.jpg',    glow:'#e3f2fd'},
  {name:'Dolphin',file:'btn_22_dolphin.jpg',  glow:'#b3e5fc'},
  {name:'Turtle', file:'btn_23_turtle.jpg',   glow:'#c8e6c9'},
  {name:'Cloud',  file:'btn_24_cloud.jpg',    glow:'#e8eaf6'},
  {name:'Dog',    file:'btn_25_dog.jpg',      glow:'#ffe0b2'},
  {name:'Chick',  file:'btn_26_chick.jpg',    glow:'#fff9c4'},
  {name:'Octopus',file:'btn_27_octopus.jpg',  glow:'#fce4ec'},
];

// ── BUILD GRID ────────────────────────────────────────
const grid=document.getElementById('grid');
const stage=document.getElementById('stage');

function buildGrid(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  // 4 cols, 7 rows, 8px gap, 10px padding each side
  // solve for button size that fits both dimensions
  const maxBW=Math.floor((sw - 20 - 8*3) / 4);
  const maxBH=Math.floor((sh - 20 - 8*6) / 7);
  const bSize=Math.min(maxBW, maxBH, 160); // cap at 160px

  grid.style.gridTemplateColumns=`repeat(4,${bSize}px)`;
  grid.style.gridTemplateRows=`repeat(7,${bSize}px)`;

  if(grid.children.length===28) return; // already built, just resized

  BUTTONS.forEach((btn,i)=>{
    const div=document.createElement('div');
    div.className='sqbtn';
    div.dataset.idx=i;
    div.style.setProperty('--glow', btn.glow);
    const img=document.createElement('img');
    img.src='/'+btn.file;
    img.alt=btn.name;
    img.draggable=false;
    div.appendChild(img);
    grid.appendChild(div);
  });
}
window.addEventListener('resize',()=>{
  const sw=stage.clientWidth, sh=stage.clientHeight;
  const maxBW=Math.floor((sw-20-24)/4);
  const maxBH=Math.floor((sh-20-48)/7);
  const bSize=Math.min(maxBW,maxBH,160);
  grid.style.gridTemplateColumns=`repeat(4,${bSize}px)`;
  grid.style.gridTemplateRows=`repeat(7,${bSize}px)`;
});
buildGrid();

// ── AUDIO ─────────────────────────────────────────────
let AC=null;
function ac(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function osc(type,f0,f1,dur,vol){
  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f0,a.currentTime);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+dur+0.02);
}
function noise(dur,vol,fc){
  const a=ac(),buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;f.type='lowpass';f.frequency.value=fc;
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);
  s.start();s.stop(a.currentTime+dur+0.02);
}
const SOUNDS={
  'Pop 🫧':()=>{osc('sine',500,860,0.09,0.5);},
  'Click 🖱️':()=>{noise(0.03,0.65,4500);osc('square',200,200,0.025,0.18);},
  'Squish 🫠':()=>{osc('sine',200,72,0.17,0.55);},
  'Boing 🏀':()=>{osc('sine',110,430,0.15,0.5);},
  'Bubble 🫧':()=>{osc('sine',560+Math.random()*80,980,0.14,0.32);},
  'Tap 👆':()=>{noise(0.022,0.72,2200);osc('triangle',380,380,0.022,0.14);},
  'Plop 💧':()=>{osc('sine',740,180,0.12,0.42);},
  'Ping ✨':()=>{osc('sine',1260,1260,0.4,0.24);osc('sine',1900,1900,0.22,0.12);},
  'Thud 🥁':()=>{osc('sine',80,28,0.14,0.72);noise(0.055,0.28,700);},
  'Squeak 🐭':()=>{osc('sawtooth',800,1480,0.07,0.16);},
};
let currentSound='Pop 🫧';

// ── SOUND PICKER ──────────────────────────────────────
const soundScroll=document.getElementById('soundScroll');
Object.keys(SOUNDS).forEach(name=>{
  const b=document.createElement('div');
  b.className='snd-btn'+(name===currentSound?' active':'');
  b.textContent=name;
  b.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    currentSound=name;
    document.querySelectorAll('.snd-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    SOUNDS[name]();
  });
  soundScroll.appendChild(b);
});

// ── PARTICLES ────────────────────────────────────────
const EMOJIS=['✨','⭐','💫','🌟','🎉','💕','🌈'];
function burst(x,y,color){
  for(let i=0;i<9;i++){
    const p=document.createElement('div');
    const isEmoji=Math.random()<0.4;
    if(isEmoji){
      p.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${12+Math.random()*12}px;pointer-events:none;z-index:60;transform:translate(-50%,-50%)`;
      p.textContent=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    } else {
      const sz=4+Math.random()*8;
      p.className='particle';
      p.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:${color};transform:translate(-50%,-50%)`;
    }
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=28+Math.random()*72;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    requestAnimationFrame(()=>{
      p.style.transition='transform 0.55s cubic-bezier(.2,.8,.4,1),opacity 0.5s ease';
      p.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${0.4+Math.random()*0.9})`;
      p.style.opacity='0';
    });
    setTimeout(()=>p.remove(),600);
  }
}

// ── PRESS / RELEASE ──────────────────────────────────
const held=new Map();

function press(btn,cx,cy){
  if(btn.classList.contains('pressed')) return;
  btn.classList.add('pressed');
  const idx=+btn.dataset.idx;
  SOUNDS[currentSound]();
  burst(cx,cy,BUTTONS[idx].glow);
}
function release(btn){
  btn.classList.remove('pressed');
}

document.addEventListener('pointerdown',e=>{
  const btn=e.target.closest('.sqbtn');
  if(!btn) return;
  e.preventDefault();
  ac();
  held.set(e.pointerId,btn);
  press(btn,e.clientX,e.clientY);
},{passive:false});

document.addEventListener('pointermove',e=>{
  if(!held.has(e.pointerId)) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const newBtn=el?.closest('.sqbtn');
  const oldBtn=held.get(e.pointerId);
  if(newBtn!==oldBtn){
    if(oldBtn) release(oldBtn);
    if(newBtn){
      held.set(e.pointerId,newBtn);
      press(newBtn,e.clientX,e.clientY);
    } else {
      held.delete(e.pointerId);
    }
  }
},{passive:true});

function end(e){
  const btn=held.get(e.pointerId);
  if(btn) release(btn);
  held.delete(e.pointerId);
}
document.addEventListener('pointerup',end,{passive:true});
document.addEventListener('pointercancel',end,{passive:true});
</script>
</body>
</html>
