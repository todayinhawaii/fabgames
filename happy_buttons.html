<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Happy Buttons 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Baloo 2',sans-serif;
  touch-action:none;
  background:#c8bfb0;
}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;
  background:rgba(22,16,12,0.92);backdrop-filter:blur(6px);
  border-bottom:2px solid rgba(255,215,0,0.3);
}
.logo{
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;
  background:linear-gradient(135deg,#ffd700,#ffb347,#ff8fab);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.home-link{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,215,0,0.35);
  color:#e8c96a;text-decoration:none;font-size:16px;
}

/* ── STAGE ── */
#stage{
  position:fixed;top:50px;bottom:110px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* ── GRID ── */
#grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:10px;
  background:linear-gradient(145deg,#b0a498,#c8bfb0);
  border-radius:20px;
  box-shadow:
    0 12px 40px rgba(0,0,0,0.45),
    0 0 0 3px rgba(255,255,255,0.15),
    inset 0 2px 6px rgba(0,0,0,0.2);
}

/* ── EACH BUTTON ── */
.sqbtn{
  position:relative;
  border-radius:16px;
  cursor:pointer;
  overflow:hidden;

  /* 3D RAISED */
  box-shadow:
    0 7px 0 rgba(0,0,0,0.30),
    0 10px 18px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.45),
    inset 0 -2px 4px rgba(0,0,0,0.12);

  transform:translateY(0px);
  transition:
    transform 0.13s cubic-bezier(.35,0,.2,1),
    box-shadow 0.13s cubic-bezier(.35,0,.2,1),
    filter 0.13s;
  will-change:transform,box-shadow;
}
.sqbtn img{
  display:block;width:100%;height:100%;
  object-fit:cover;border-radius:14px;
  pointer-events:none;
  -webkit-user-drag:none;
}

/* ── PRESSED STATE ── */
.sqbtn.pressed{
  transform:translateY(12px) scale(0.91);
  box-shadow:
    0 1px 0 rgba(0,0,0,0.32),
    0 2px 5px rgba(0,0,0,0.18),
    inset 0 8px 22px rgba(0,0,0,0.42),
    inset 0 3px 6px rgba(0,0,0,0.28);
  filter:brightness(0.80) saturate(1.35);
}

/* Glow ring on press */
.sqbtn::after{
  content:'';
  position:absolute;inset:0;border-radius:14px;
  opacity:0;pointer-events:none;
  transition:opacity 0.1s;
  box-shadow:0 0 0 3px var(--glow,#ffd700), 0 0 20px var(--glow,#ffd700);
}
.sqbtn.pressed::after{ opacity:1; }

/* ── SOUND BAR ── */
#soundBar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:8px 10px 42px;
  background:rgba(12,22,12,0.96);backdrop-filter:blur(8px);
  border-top:2px solid rgba(255,215,0,0.4);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
#soundLabel{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,215,0,0.75);font-weight:800;
}
#soundScroll{
  display:flex;gap:8px;overflow-x:auto;width:100%;
  padding:2px 4px;scrollbar-width:none;
  justify-content:flex-start;
}
#soundScroll::-webkit-scrollbar{display:none;}
@media(min-width:600px){
  #soundScroll{justify-content:center;flex-wrap:wrap;overflow-x:visible;}
}

@keyframes pillPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(200,255,100,0.0), 0 2px 0 #1a3a0a;}
  50%{box-shadow:0 0 0 5px rgba(200,255,100,0.18), 0 2px 0 #1a3a0a;}
}
@keyframes pillPulseActive{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.0), 0 3px 0 #7a5800, 0 0 12px rgba(255,215,0,0.4);}
  50%{box-shadow:0 0 0 6px rgba(255,215,0,0.25), 0 3px 0 #7a5800, 0 0 22px rgba(255,215,0,0.65);}
}
.snd-btn{
  flex-shrink:0;padding:6px 15px;border-radius:22px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11px;
  background:linear-gradient(135deg,#1a3a0a,#2a5a12);
  border:2px solid rgba(180,230,80,0.35);
  color:#c8f06a;cursor:pointer;white-space:nowrap;
  transition:transform 0.12s;
  box-shadow:0 2px 0 #1a3a0a;
  animation:pillPulse 2.2s ease-in-out infinite;
}
.snd-btn:active{transform:scale(0.95);}
.snd-btn.active{
  background:linear-gradient(135deg,#3a6a00,#5a9a00);
  border:2.5px solid #ffd700;
  color:#ffd700;
  box-shadow:0 3px 0 #7a5800, 0 0 14px rgba(255,215,0,0.5);
  animation:pillPulseActive 1.8s ease-in-out infinite;
}


/* ── IMMERSIVE / COLLAPSE ── */
#collapseBtn{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:56;
  width:54px;height:22px;border-radius:10px 10px 0 0;
  background:rgba(12,28,8,0.9);border:1.5px solid rgba(255,215,0,0.5);
  border-bottom:none;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#c8f06a;cursor:pointer;
  transition:bottom 0.3s ease, border-radius 0.3s ease, height 0.3s ease;
  box-shadow:0 -3px 12px rgba(0,0,0,0.4);
}
#collapseBtn:hover{background:rgba(30,60,12,0.98);color:#ffd700;}
body.immersive #collapseBtn{
  bottom:6px;border-radius:14px;border:1.5px solid rgba(255,215,0,0.55);
  height:26px;width:60px;
  box-shadow:0 0 16px rgba(255,215,0,0.35);
  animation:arrowPulse 2s ease-in-out infinite;
}
@keyframes arrowPulse{
  0%,100%{box-shadow:0 0 6px rgba(255,215,0,0.2);}
  50%{box-shadow:0 0 18px rgba(255,215,0,0.55);}
}

/* Transitions on bars */
#topbar{transition:transform 0.3s ease, opacity 0.3s ease;}
#soundBar{transition:transform 0.3s ease, opacity 0.3s ease;}
body.immersive #topbar{
  transform:translateY(-100%);opacity:0;pointer-events:none;
}
body.immersive #soundBar{
  transform:translateY(100%);opacity:0;pointer-events:none;
}
body.immersive #stage{
  top:0 !important;bottom:0 !important;
}
/* Explicit non-immersive restore */
body:not(.immersive) #stage{
  top:50px !important;bottom:110px !important;
}
body:not(.immersive) #topbar{
  transform:translateY(0) !important;opacity:1 !important;pointer-events:auto !important;
}
body:not(.immersive) #soundBar{
  transform:translateY(0) !important;opacity:1 !important;pointer-events:auto !important;
}
body.immersive #collapseBtn{bottom:4px;}

/* Particles */
.particle{position:fixed;pointer-events:none;z-index:60;border-radius:50%;}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">🐾 Happy Buttons</div>
  <a href="/" class="home-link">🏠</a>
</div>

<div id="collapseBtn" title="Expand / Collapse">▼</div>
<div id="stage">
  <div id="grid"></div>
</div>

<div id="soundBar">
  <div id="soundLabel">🔊 Choose your sound</div>
  <div id="soundScroll"></div>
</div>

<script>
// ── BUTTON DATA ───────────────────────────────────────
const BUTTONS=[
  {name:'Bunny',  file:'btn_00_bunny.jpg',    glow:'#ffb3c6'},
  {name:'Panda',  file:'btn_01_panda.jpg',    glow:'#c8e6c9'},
  {name:'Penguin',file:'btn_02_penguin.jpg',  glow:'#bbdefb'},
  {name:'Bear',   file:'btn_03_bear.jpg',     glow:'#ffe0b2'},
  {name:'Duck',   file:'btn_04_duck.jpg',     glow:'#fff9c4'},
  {name:'Frog',   file:'btn_05_frog.jpg',     glow:'#c5e1a5'},
  {name:'Fox',    file:'btn_06_fox.jpg',      glow:'#ffccbc'},
  {name:'Koala',  file:'btn_07_koala.jpg',    glow:'#d7ccc8'},
  {name:'Hippo',  file:'btn_08_hippo.jpg',    glow:'#ce93d8'},
  {name:'Giraffe',file:'btn_09_giraffe.jpg',  glow:'#ffe082'},
  {name:'Elephant',file:'btn_10_elephant.jpg',glow:'#b3e5fc'},
  {name:'Cat',    file:'btn_11_cat.jpg',      glow:'#f8bbd0'},
  {name:'Seal',   file:'btn_12_seal.jpg',     glow:'#e0f7fa'},
  {name:'Unicorn',file:'btn_13_unicorn.jpg',  glow:'#f3e5f5'},
  {name:'Lion',   file:'btn_14_lion.jpg',     glow:'#ffe0b2'},
  {name:'Pig',    file:'btn_15_pig.jpg',      glow:'#fce4ec'},
  {name:'Sloth',  file:'btn_16_sloth.jpg',    glow:'#d7ccc8'},
  {name:'Hedgehog',file:'btn_17_hedgehog.jpg',glow:'#dcedc8'},
  {name:'Dino',   file:'btn_18_dino.jpg',     glow:'#b2dfdb'},
  {name:'Otter',  file:'btn_19_otter.jpg',    glow:'#ffe0b2'},
  {name:'Bee',    file:'btn_20_bee.jpg',      glow:'#fff9c4'},
  {name:'Sheep',  file:'btn_21_sheep.jpg',    glow:'#e3f2fd'},
  {name:'Dolphin',file:'btn_22_dolphin.jpg',  glow:'#b3e5fc'},
  {name:'Turtle', file:'btn_23_turtle.jpg',   glow:'#c8e6c9'},
  {name:'Cloud',  file:'btn_24_cloud.jpg',    glow:'#e8eaf6'},
  {name:'Dog',    file:'btn_25_dog.jpg',      glow:'#ffe0b2'},
  {name:'Chick',  file:'btn_26_chick.jpg',    glow:'#fff9c4'},
  {name:'Octopus',file:'btn_27_octopus.jpg',  glow:'#fce4ec'},
];

// ── BUILD GRID ────────────────────────────────────────
const grid=document.getElementById('grid');
const stage=document.getElementById('stage');

function buildGrid(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  // 4 cols, 7 rows, 8px gap, 10px padding each side
  // solve for button size that fits both dimensions
  const maxBW=Math.floor((sw - 20 - 8*3) / 4);
  const maxBH=Math.floor((sh - 20 - 8*6) / 7);
  const bSize=Math.min(maxBW, maxBH, 160); // cap at 160px

  grid.style.gridTemplateColumns=`repeat(4,${bSize}px)`;
  grid.style.gridTemplateRows=`repeat(7,${bSize}px)`;

  if(grid.children.length===28) return; // already built, just resized

  BUTTONS.forEach((btn,i)=>{
    const div=document.createElement('div');
    div.className='sqbtn';
    div.dataset.idx=i;
    div.style.setProperty('--glow', btn.glow);
    const img=document.createElement('img');
    img.src='/'+btn.file;
    img.alt=btn.name;
    img.draggable=false;
    div.appendChild(img);
    grid.appendChild(div);
  });
}
function resizeGrid(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  const maxBW=Math.floor((sw-20-24)/4);
  const maxBH=Math.floor((sh-20-48)/7);
  const bSize=Math.min(maxBW,maxBH,180);
  grid.style.gridTemplateColumns=`repeat(4,${bSize}px)`;
  grid.style.gridTemplateRows=`repeat(7,${bSize}px)`;
}
window.addEventListener('resize',resizeGrid);
buildGrid();

// ── AUDIO ─────────────────────────────────────────────
let AC=null;
function ac(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function osc(type,f0,f1,dur,vol){
  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f0,a.currentTime);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+dur+0.02);
}
function noise(dur,vol,fc){
  const a=ac(),buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;f.type='lowpass';f.frequency.value=fc;
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);
  s.start();s.stop(a.currentTime+dur+0.02);
}
const SOUNDS={
  'Pop 🫧':()=>{
    osc('sine',520,920,0.10,0.85);
    osc('sine',820,1200,0.06,0.4);
  },
  'Click 🖱️':()=>{
    noise(0.04,1.1,5000);
    osc('square',220,220,0.035,0.4);
  },
  'Squish 🫠':()=>{
    // Slow wet squelch — pitch drops WAY down like squeezing a sponge
    osc('sine',320,28,0.35,1.1);
    osc('sine',280,18,0.38,0.7);
    noise(0.25,0.4,300);
  },
  'Boing 🏀':()=>{
    // Sharp twang — pitch ROCKETS up fast like a spring
    osc('triangle',60,1400,0.18,1.2);
    osc('sine',80,1800,0.14,0.8);
    setTimeout(()=>osc('triangle',900,200,0.22,0.5),80);
  },
  'Bubble 🫧':()=>{
    osc('sine',580+Math.random()*100,1050,0.16,0.75);
    setTimeout(()=>osc('sine',820,400,0.10,0.4),60);
  },
  'Tap 👆':()=>{
    noise(0.028,1.1,2500);
    osc('triangle',400,400,0.028,0.35);
  },
  'Plop 💧':()=>{
    osc('sine',780,160,0.15,0.9);
    noise(0.06,0.35,600);
  },
  'Ping ✨':()=>{
    osc('sine',1320,1320,0.5,0.6);
    osc('sine',2000,2000,0.3,0.35);
    osc('sine',660,660,0.4,0.3);
  },
  'Thud 🥁':()=>{
    osc('sine',85,22,0.22,1.3);
    noise(0.09,0.7,900);
    osc('sine',140,40,0.15,0.6);
  },
  'Squeak 🐭':()=>{
    osc('sawtooth',820,1600,0.09,0.45);
    setTimeout(()=>osc('sawtooth',1400,600,0.09,0.3),70);
  },
};
let currentSound='Pop 🫧';

// ── SOUND PICKER ──────────────────────────────────────
const soundScroll=document.getElementById('soundScroll');
Object.keys(SOUNDS).forEach(name=>{
  const b=document.createElement('div');
  b.className='snd-btn'+(name===currentSound?' active':'');
  b.textContent=name;
  b.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    currentSound=name;
    document.querySelectorAll('.snd-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    SOUNDS[name]();
  });
  soundScroll.appendChild(b);
});

// ── PARTICLES ────────────────────────────────────────
const EMOJIS=['✨','⭐','💫','🌟','🎉','💕','🌈'];
function burst(x,y,color){
  for(let i=0;i<16;i++){
    const p=document.createElement('div');
    const isEmoji=Math.random()<0.4;
    if(isEmoji){
      p.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${16+Math.random()*18}px;pointer-events:none;z-index:60;transform:translate(-50%,-50%)`;
      p.textContent=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    } else {
      const sz=4+Math.random()*8;
      p.className='particle';
      p.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:${color};transform:translate(-50%,-50%)`;
    }
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*110;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    requestAnimationFrame(()=>{
      p.style.transition='transform 0.55s cubic-bezier(.2,.8,.4,1),opacity 0.5s ease';
      p.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${0.4+Math.random()*0.9})`;
      p.style.opacity='0';
    });
    setTimeout(()=>p.remove(),600);
  }
}

// ── PRESS / RELEASE ──────────────────────────────────
const held=new Map();

function press(btn,cx,cy){
  if(btn.classList.contains('pressed')) return;
  btn.classList.add('pressed');
  const idx=+btn.dataset.idx;
  SOUNDS[currentSound]();
  burst(cx,cy,BUTTONS[idx].glow);
}
function release(btn){
  btn.classList.remove('pressed');
}

document.addEventListener('pointerdown',e=>{
  const btn=e.target.closest('.sqbtn');
  if(!btn) return;
  e.preventDefault();
  ac();
  held.set(e.pointerId,btn);
  press(btn,e.clientX,e.clientY);
},{passive:false});

document.addEventListener('pointermove',e=>{
  if(!held.has(e.pointerId)) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const newBtn=el?.closest('.sqbtn');
  const oldBtn=held.get(e.pointerId);
  if(newBtn!==oldBtn){
    if(oldBtn) release(oldBtn);
    if(newBtn){
      held.set(e.pointerId,newBtn);
      press(newBtn,e.clientX,e.clientY);
    } else {
      held.delete(e.pointerId);
    }
  }
},{passive:true});

function end(e){
  const btn=held.get(e.pointerId);
  if(btn) release(btn);
  held.delete(e.pointerId);
}
document.addEventListener('pointerup',end,{passive:true});
document.addEventListener('pointercancel',end,{passive:true});

// ── IMMERSIVE TOGGLE ─────────────────────────────────
const collapseBtn=document.getElementById('collapseBtn');
let immersive=false;
let restoreTimer=null;

function setImmersive(on){
  immersive=on;
  document.body.classList.toggle('immersive',on);
  collapseBtn.textContent=on?'▲':'▼';
  collapseBtn.title=on?'Show menus':'Hide menus';
  // resize grid after transition
  setTimeout(resizeGrid,320);
}

collapseBtn.addEventListener('click',()=>{
  if(!immersive && Date.now()-lastRestoreTime<400) return; // skip if just restored by hover
  setImmersive(!immersive);
});
collapseBtn.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!immersive && Date.now()-lastRestoreTime<400) return;
  setImmersive(!immersive);
});

// Cooldown prevents mousemove-restore from immediately being re-collapsed by the ensuing click
let lastRestoreTime=0;

// Desktop: hover near bottom restores menus
document.addEventListener('mousemove',e=>{
  if(!immersive) return;
  if(e.clientY > window.innerHeight-70){
    setImmersive(false);
    lastRestoreTime=Date.now();
  }
});

// Mobile: touch near bottom of screen restores
document.addEventListener('touchstart',e=>{
  if(!immersive) return;
  const y=e.touches[0].clientY;
  if(y > window.innerHeight-80){
    setImmersive(false);
    lastRestoreTime=Date.now();
  }
},{passive:true});

</script>
</body>
</html>
